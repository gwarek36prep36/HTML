<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>
    {% block title %}
    문장 순서 맞추기
    {% endblock %}
</title>


<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family:
        'Apple SD Gothic Neo',
        'Malgun Gothic',
        sans-serif;
}


body {

    min-height: 100vh;

    display: flex;

    align-items: center;

    justify-content: center;

    background:
        linear-gradient(
            135deg,
            #667eea 0%,
            #764ba2 100%
        );

    padding: 20px;

}


/* ========================================
   전체 레이아웃
   ======================================== */

.page-layout {

    width: 100%;

    max-width: 850px;

    display: flex;

    align-items: flex-start;

    justify-content: center;

    gap: 18px;

}


/* ========================================
   기존 메인 카드
   ======================================== */

.card {

    background: #fff;

    border-radius: 20px;

    padding: 40px 32px;

    max-width: 480px;

    width: 100%;

    box-shadow:
        0 20px 60px
        rgba(0,0,0,0.2);

    flex: 1;

    min-width: 0;

}


h1 {

    font-size: 24px;

    color: #333;

    margin-bottom: 8px;

    text-align: center;

}


.subtitle {

    text-align: center;

    color: #888;

    font-size: 14px;

    margin-bottom: 28px;

}


textarea,
input[type="text"] {

    width: 100%;

    padding: 14px 16px;

    border:
        2px solid #e0e0e0;

    border-radius: 12px;

    font-size: 15px;

    resize: vertical;

    outline: none;

    transition:
        border-color 0.2s;

}


textarea:focus,
input[type="text"]:focus {

    border-color: #764ba2;

}


button {

    width: 100%;

    margin-top: 16px;

    padding: 14px;

    border: none;

    border-radius: 12px;

    background:
        linear-gradient(
            135deg,
            #667eea 0%,
            #764ba2 100%
        );

    color: #fff;

    font-size: 16px;

    font-weight: 600;

    cursor: pointer;

    transition:
        transform 0.1s,
        opacity 0.2s;

}


button:hover {

    opacity: 0.9;

}


button:active {

    transform: scale(0.98);

}


/* ========================================
   퀴즈
   ======================================== */

.progress {

    text-align: center;

    font-size: 13px;

    color: #aaa;

    margin-bottom: 16px;

    font-weight: 600;

    letter-spacing: 1px;

}


.word-count-info {

    font-size: 13px;

    color: #aaa;

    margin-bottom: 8px;

    text-align: right;

}


.word-count-info strong {

    color: #764ba2;

}


.input-wrap {

    position: relative;

}


.input-wrap input {

    padding-right: 70px;

}


.count-badge {

    position: absolute;

    right: 14px;

    top: 50%;

    transform:
        translateY(-50%);

    font-size: 13px;

    font-weight: 600;

    color: #764ba2;

    pointer-events: none;

}


.shuffled-box {

    background: #f7f6fb;

    border-radius: 14px;

    padding: 20px;

    margin-bottom: 20px;

    display: flex;

    flex-wrap: wrap;

    gap: 8px;

    justify-content: center;

}


.word-chip {

    background: #fff;

    border:
        1px solid #e0d8f0;

    border-radius: 8px;

    padding: 6px 12px;

    font-size: 15px;

    color: #555;

    font-weight: 500;

    cursor: pointer;

    user-select: none;

    transition:
        background 0.15s,
        color 0.15s;

}


.word-chip.used {

    background: #555;

    color: #fff;

    border-color: #444;

}


/* ========================================
   피드백
   ======================================== */

.feedback {

    text-align: center;

    border-radius: 12px;

    padding: 14px;

    margin-bottom: 16px;

    font-size: 16px;

    font-weight: 700;

}


.feedback.correct {

    background: #e6f9ee;

    color: #1ca053;

}


.feedback.wrong {

    background: #fdecec;

    color: #e1483f;

}


.feedback
.correct-answer {

    display: block;

    margin-top: 6px;

    font-size: 13px;

    font-weight: 500;

    color: #888;

}


.error {

    text-align: center;

    color: #e1483f;

    font-size: 14px;

    margin-bottom: 12px;

    font-weight: 600;

}


.result-score {

    text-align: center;

    font-size: 48px;

    font-weight: 800;

    background:
        linear-gradient(
            135deg,
            #667eea 0%,
            #764ba2 100%
        );

    -webkit-background-clip: text;

    -webkit-text-fill-color: transparent;

    background-clip: text;

    margin: 20px 0;

}


.retry-btn {

    background:
        linear-gradient(
            135deg,
            #ff9a56 0%,
            #ff6b6b 100%
        );

}


.secondary-btn {

    background: #f0f0f0;

    color: #666;

    box-shadow: none;

}


.result-sub {

    text-align: center;

    color: #888;

    font-size: 14px;

    margin-bottom: 20px;

}


/* ========================================
   오른쪽 지문 보관함
   ======================================== */

.passage-sidebar {

    width: 270px;

    background: #fff;

    border-radius: 18px;

    padding: 20px;

    box-shadow:
        0 20px 60px
        rgba(0,0,0,0.15);

    flex-shrink: 0;

}


.passage-sidebar h2 {

    font-size: 18px;

    color: #333;

    margin-bottom: 5px;

}


.passage-sidebar-subtitle {

    color: #999;

    font-size: 12px;

    margin-bottom: 15px;

}


.passage-add-btn {

    margin-top: 0;

    font-size: 14px;

    padding: 11px;

}


.passage-list {

    margin-top: 15px;

    max-height: 330px;

    overflow-y: auto;

}


.passage-item {

    background: #f7f6fb;

    border-radius: 10px;

    padding: 11px;

    margin-bottom: 8px;

}


.passage-item-title {

    font-size: 13px;

    font-weight: 700;

    color: #555;

    margin-bottom: 5px;

}


.passage-item-text {

    font-size: 12px;

    line-height: 1.4;

    color: #888;

    display: -webkit-box;

    -webkit-line-clamp: 2;

    -webkit-box-orient: vertical;

    overflow: hidden;

}


.passage-select-btn {

    margin-top: 8px;

    padding: 8px;

    font-size: 12px;

}


.passage-manage-btn {

    background: #f0f0f0;

    color: #666;

    font-size: 13px;

    padding: 10px;

}


/* ========================================
   작은 화면
   ======================================== */

@media (max-width: 750px) {

    .page-layout {

        flex-direction: column;

        align-items: stretch;

        max-width: 480px;

    }


    .passage-sidebar {

        width: 100%;

    }

}

</style>

</head>


<body>


<div class="page-layout">


    <!-- 메인 카드 -->

    <div class="card">

        {% block content %}
        {% endblock %}

    </div>


    <!-- 오른쪽 사이드바 -->

    {% block sidebar %}
    {% endblock %}


</div>


</body>

</html>
